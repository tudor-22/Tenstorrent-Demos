<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORRERY — Interactive Solar System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04070f; --panel:rgba(9,15,29,.9); --line:#1d2c4c; --line2:#2e4577;
  --ink:#d7e1f6; --dim:#74849f; --faint:#48587a;
  --amber:#ffb454; --amber2:#ffd98a; --cyan:#8fd8ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'IBM Plex Mono',monospace;color:var(--ink);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;display:block;cursor:crosshair}
#gl.can{cursor:pointer}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 40%, transparent 52%, rgba(2,4,10,.55) 100%)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.plabel{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:5px;
  font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;white-space:nowrap;transition:opacity .25s}
.plabel .pt{width:5px;height:5px;transform:rotate(45deg);display:block}
.plabel .ln{width:1px;height:9px;display:block;opacity:.45}
.plabel.hot{color:#fff!important}

.corner{position:fixed;width:26px;height:26px;z-index:3;pointer-events:none;opacity:.45}
.c-tl{top:10px;left:10px;border-top:1px solid var(--line2);border-left:1px solid var(--line2)}
.c-tr{top:10px;right:10px;border-top:1px solid var(--line2);border-right:1px solid var(--line2)}
.c-bl{bottom:10px;left:10px;border-bottom:1px solid var(--line2);border-left:1px solid var(--line2)}
.c-br{bottom:10px;right:10px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2)}

#tl{position:fixed;top:22px;left:24px;z-index:5;pointer-events:none}
#tl h1{font:900 25px/1 'Orbitron',sans-serif;letter-spacing:.3em;display:flex;align-items:center;gap:10px}
.live{width:7px;height:7px;background:var(--amber);display:inline-block;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.2}}
#tl .sub{font-size:9px;letter-spacing:.34em;color:var(--faint);margin:6px 0 12px}
#tl .mrow{display:flex;align-items:baseline;gap:10px;font-size:12px}
#tl .mrow+.mrow{margin-top:3px}
.mlab{font-size:8.5px;letter-spacing:.24em;color:var(--faint);width:64px}
#sdate{color:var(--amber2)}
#tdays{color:var(--ink)}

#tr{position:fixed;top:24px;right:26px;z-index:5;text-align:right;
  font-size:9px;letter-spacing:.22em;color:var(--faint);line-height:2;pointer-events:none}
#tr b{color:var(--dim);font-weight:600}

#rail{position:fixed;top:118px;left:22px;z-index:5;width:190px}
.rail-head{font-size:9px;letter-spacing:.3em;color:var(--faint);padding:0 10px 8px;display:flex;justify-content:space-between}
.rail-head span{color:var(--amber)}
#list{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow-y:auto}
#list button{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;
  background:transparent;border:0;border-left:2px solid transparent;color:var(--dim);
  font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-align:left;
  padding:7px 8px 7px 9px;cursor:pointer;transition:background .15s,color .15s,transform .15s,border-color .15s}
#list button .dot{width:6px;height:6px;transform:rotate(45deg);display:block}
#list button .au{font-size:9px;color:var(--faint)}
#list button:hover,#list button.hot{background:rgba(40,58,102,.35);color:var(--ink);transform:translateX(3px)}
#list button.hot .au{color:var(--amber2)}
#list button.sel{border-left-color:var(--amber);color:var(--ink);background:rgba(255,180,84,.07)}

#card{position:fixed;top:96px;right:22px;z-index:5;width:294px;
  background:var(--panel);border:1px solid var(--line);padding:18px 18px 16px;
  opacity:0;transform:translateX(20px);pointer-events:none;
  transition:opacity .35s cubic-bezier(.2,.9,.25,1),transform .35s cubic-bezier(.2,.9,.25,1)}
#card::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:var(--pc,var(--amber))}
#card.open{opacity:1;transform:none;pointer-events:auto}
.card-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
#cIdx{font:700 19px 'Orbitron',sans-serif;color:var(--amber)}
#cTrack{font-size:9px;letter-spacing:.24em;color:var(--cyan);animation:pulse 2s infinite}
#cName{font:900 26px/1.05 'Orbitron',sans-serif;letter-spacing:.06em}
#cType{font-size:9.5px;letter-spacing:.24em;color:var(--dim);margin:6px 0 12px;
  padding-bottom:11px;border-bottom:1px solid var(--line)}
.grow{display:flex;justify-content:space-between;align-items:baseline;
  padding:7px 0;border-bottom:1px dashed rgba(46,69,119,.45)}
.grow span{font-size:9px;letter-spacing:.2em;color:var(--faint)}
.grow b{font-size:12px;font-weight:600;color:var(--ink);text-align:right}
#cFact{margin-top:13px;font-size:12px;line-height:1.65;color:#b9c6e2;
  padding-left:11px;border-left:2px solid var(--pc,var(--amber))}
#cRelease{margin-top:15px;width:100%;background:transparent;border:1px solid var(--line);
  color:var(--dim);font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.24em;
  padding:9px;cursor:pointer;transition:all .15s}
#cRelease:hover{color:var(--amber);border-color:rgba(255,180,84,.5);background:rgba(255,180,84,.07)}

#console{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);padding:10px 14px;max-width:94vw}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--dim);
  font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.16em;padding:7px 11px;cursor:pointer;
  transition:all .15s;white-space:nowrap}
.tbtn:hover{color:var(--ink);border-color:var(--line2);background:rgba(46,69,119,.25)}
.tbtn:active{transform:scale(.95)}
.tbtn.on{color:var(--amber);border-color:rgba(255,180,84,.45);background:rgba(255,180,84,.08)}
.div{width:1px;height:20px;background:var(--line)}
#speed{-webkit-appearance:none;appearance:none;width:190px;height:2px;background:#22335c;outline:0;cursor:pointer}
#speed::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--amber);
  border:2px solid #0a1122;transform:rotate(45deg);cursor:grab}
#speed::-moz-range-thumb{width:11px;height:11px;background:var(--amber);border:2px solid #0a1122;border-radius:0;cursor:grab}
#speedVal{font-size:10px;letter-spacing:.14em;color:var(--amber2);width:74px}

#tip{position:fixed;z-index:9;padding:6px 9px;background:#0b1326;border:1px solid var(--line2);
  font-size:10px;letter-spacing:.14em;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
#tip.show{opacity:1}
#tip i{display:inline-block;width:6px;height:6px;margin-right:7px;transform:rotate(45deg)}

#boot{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;
  transition:opacity .7s}
#boot h1{font:900 32px 'Orbitron',sans-serif;letter-spacing:.42em;padding-left:.42em}
.boot-sub{font-size:9px;letter-spacing:.42em;color:var(--faint);margin-top:12px}
.boot-bar{width:180px;height:2px;background:#14203c;margin:20px auto 0;overflow:hidden}
.boot-bar i{display:block;height:100%;width:38%;background:var(--amber);animation:boot 1.1s infinite}
@keyframes boot{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
#boot.done{opacity:0;pointer-events:none}

@media (max-width:820px){
  #tr{display:none}
  #tl h1{font-size:17px}
  #tl .clock{display:none}
  #rail{top:96px;width:150px}
  #list button{font-size:10px}
  #card{width:236px;top:80px;right:10px}
  #cName{font-size:19px}
  #speed{width:110px}
}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="labels"></div>
<div class="corner c-tl"></div><div class="corner c-tr"></div>
<div class="corner c-bl"></div><div class="corner c-br"></div>

<header id="tl">
  <h1><span class="live"></span>ORRERY</h1>
  <div class="sub">INTERACTIVE SOLAR SYSTEM</div>
  <div class="clock">
    <div class="mrow"><span class="mlab">SIM DATE</span><span id="sdate">2025-01-01</span></div>
    <div class="mrow"><span class="mlab">ELAPSED</span><span id="tdays">T+000000 D</span></div>
  </div>
</header>

<div id="tr">
  <div><b>DRAG</b> ORBIT &nbsp;·&nbsp; <b>SCROLL</b> ZOOM</div>
  <div><b>CLICK</b> A WORLD · FOCUS &nbsp;·&nbsp; <b>SPACE</b> PAUSE</div>
</div>

<nav id="rail">
  <div class="rail-head">BODIES <span>12</span></div>
  <div id="list"></div>
</nav>

<aside id="card">
  <div class="card-top"><span id="cIdx">01</span><span id="cTrack">◉ TRACKING</span></div>
  <h2 id="cName">—</h2>
  <div id="cType">—</div>
  <div id="cGrid"></div>
  <p id="cFact"></p>
  <button id="cRelease">RELEASE VIEW · ESC</button>
</aside>

<div id="console">
  <button id="btnPause" class="tbtn">❚❚ PAUSE</button>
  <input id="speed" type="range" min="0" max="100" value="26">
  <span id="speedVal">—</span>
  <button id="btnRev" class="tbtn">◀ REV</button>
  <span class="div"></span>
  <button id="btnOrbits" class="tbtn on">ORBITS</button>
  <button id="btnLabels" class="tbtn on">LABELS</button>
  <button id="btnBelt" class="tbtn on">BELT</button>
  <span class="div"></span>
  <button id="btnReset" class="tbtn">⟲ RESET VIEW</button>
</div>

<div id="tip"></div>
<div id="boot"><div style="text-align:center">
  <h1>ORRERY</h1><div class="boot-sub">CALIBRATING ORBITS</div>
  <div class="boot-bar"><i></i></div>
</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04070f, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 4000);
const HOME = new THREE.Vector3(0, 62, 138);
camera.position.copy(HOME);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 3; controls.maxDistance = 520;

scene.add(new THREE.AmbientLight(0x24334f, 0.55));
scene.add(new THREE.PointLight(0xfff1cf, 2.4, 0, 0));
scene.add(new THREE.PolarGridHelper(122, 8, 5, 64, 0x16244a, 0x101c38));

/* ---------- procedural texture kitchen ---------- */
function hexRGB(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function mixC(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
const rgb = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const rgba = (c,a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

function bodyTexture(spec){
  const w=512,h=256,cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  const base=hexRGB(spec.base);
  if(spec.bands){
    const bs=spec.bands.map(b=>({c:hexRGB(b.c),f:b.f,a:b.a,p:b.p||0}));
    for(let y=0;y<h;y++){
      const t=y/h; let c=base.slice();
      for(const b of bs){ c=mixC(c,b.c,b.a*(0.5+0.5*Math.sin(t*TAU*b.f+b.p))); }
      ctx.fillStyle=rgb(c); ctx.fillRect(0,y,w,1);
    }
  } else { ctx.fillStyle=rgb(base); ctx.fillRect(0,0,w,h); }
  if(spec.specks){
    for(let i=0;i<spec.specks.n;i++){
      const [hx,al]=spec.specks.cols[(Math.random()*spec.specks.cols.length)|0];
      const r=spec.specks.r0+Math.random()*(spec.specks.r1-spec.specks.r0);
      ctx.globalAlpha=al*(0.4+0.6*Math.random()); ctx.fillStyle=rgb(hexRGB(hx));
      ctx.beginPath();
      ctx.ellipse(Math.random()*w,Math.random()*h,r*1.8,r,Math.random()*TAU,0,TAU);
      ctx.fill();
    } ctx.globalAlpha=1;
  }
  if(spec.blobs){
    for(const bl of spec.blobs){
      const c=hexRGB(bl.c);
      for(let i=0;i<bl.n;i++){
        ctx.globalAlpha=bl.a*(0.55+0.45*Math.random()); ctx.fillStyle=rgb(c);
        const x=Math.random()*w, y=Math.random()*h, r=bl.r0+Math.random()*(bl.r1-bl.r0);
        for(let k=0;k<3;k++){
          ctx.beginPath();
          ctx.ellipse(x+(Math.random()-.5)*r*1.6, y+(Math.random()-.5)*r,
            r*(1+(Math.random()-.5)*.6), r*(.7+Math.random()*.5), Math.random()*TAU,0,TAU);
          ctx.fill();
        }
      } ctx.globalAlpha=1;
    }
  }
  if(spec.spots){
    for(const s of spec.spots){
      const x=s.x*w,y=s.y*h,r=s.r;
      const g=ctx.createRadialGradient(x,y,r*.15,x,y,r);
      g.addColorStop(0,rgba(hexRGB(s.c),.95)); g.addColorStop(.7,rgba(hexRGB(s.c),.5)); g.addColorStop(1,rgba(hexRGB(s.c),0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,r*1.5,r,0,0,TAU); ctx.fill();
    }
  }
  if(spec.craters){
    const {n,r0,r1}=spec.craters;
    for(let i=0;i<n;i++){
      const x=Math.random()*w,y=Math.random()*h,r=r0+Math.random()*(r1-r0);
      ctx.globalAlpha=.16+Math.random()*.12; ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
      ctx.globalAlpha=.14+Math.random()*.12; ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(1,r*.28);
      ctx.beginPath(); ctx.arc(x-r*.18,y-r*.18,r,0,TAU); ctx.stroke();
    } ctx.globalAlpha=1;
  }
  if(spec.polar){
    const c=hexRGB(spec.polar.c||'#ffffff'), hF=spec.polar.hF, a=spec.polar.a||.9;
    let g=ctx.createLinearGradient(0,0,0,h*hF*2.2);
    g.addColorStop(0,rgba(c,a)); g.addColorStop(1,rgba(c,0));
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h*hF*2.2);
    g=ctx.createLinearGradient(0,h,0,h-h*hF*2.2);
    g.addColorStop(0,rgba(c,a)); g.addColorStop(1,rgba(c,0));
    ctx.fillStyle=g; ctx.fillRect(0,h-h*hF*2.2,w,h*hF*2.2);
  }
  const tx=new THREE.CanvasTexture(cv);
  tx.colorSpace=THREE.SRGBColorSpace; tx.anisotropy=4;
  return tx;
}

function cloudTexture(){
  const w=512,h=256,cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  for(let i=0;i<90;i++){
    const a=.08+Math.random()*.28, x=Math.random()*w, y=Math.random()*h, r=6+Math.random()*22;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(255,255,255,${a})`); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.beginPath();
    ctx.ellipse(x,y,r*2.2,r*.8,Math.random()*.6,0,TAU); ctx.fill();
  }
  const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace; return tx;
}

function glowTexture(i,m){
  const s=256,cv=document.createElement('canvas'); cv.width=s; cv.height=s;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,i); g.addColorStop(.4,m); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace; return tx;
}

function ringTexture(inner,outer,h1,h2,gap,faint){
  const s=512,cv=document.createElement('canvas'); cv.width=s; cv.height=s;
  const ctx=cv.getContext('2d');
  const R=s/2-2, sc=R/outer;
  for(let r=inner*sc; r<=outer*sc; r+=1.2){
    const t=(r/sc-inner)/(outer-inner);
    let a=Math.min(1,(.5+.5*Math.sin(r*.35))*.9 + .15*Math.sin(r*1.7));
    if(t<.08) a*=t/.08;
    if(t>.9) a*=(1-t)/.1;
    if(gap!==undefined && Math.abs(t-gap)<.045) a*=.15;
    const cc=mixC(hexRGB(h1),hexRGB(h2),.5+.5*Math.sin(r*.21));
    ctx.strokeStyle=rgba(cc,a*(faint?.4:.95)); ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(256,256,r,0,TAU); ctx.stroke();
  }
  const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace; return tx;
}

function tailTexture(){
  const w=64,h=256,cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(225,248,255,0.95)');
  g.addColorStop(.35,'rgba(160,215,255,0.4)');
  g.addColorStop(1,'rgba(120,180,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  for(let i=0;i<50;i++){
    const y=Math.random()*h*.6, a=.04+Math.random()*.1;
    ctx.fillStyle=`rgba(190,230,255,${a})`;
    ctx.fillRect(Math.random()*w, y, 2+Math.random()*3, 8+Math.random()*20);
  }
  const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace; return tx;
}

/* ---------- the body catalogue ---------- */
const BODIES=[
{ id:'sun', name:'SOL', list:'SOL', color:'#ffcf6e', au:'0.00', aub:'G-TYPE MAIN-SEQUENCE STAR',
  data:[['DIAMETER','1,392,700 KM'],['ROTATION','25.4 D (EQ.)'],['MASS SHARE','99.86 %'],['PLANETS','8']],
  fact:'A fusion furnace burning 600 million tonnes of hydrogen every second — the engine at the heart of this orrery.' },
{ id:'mercury', name:'MERCURY', color:'#a9a6b0', au:'0.39', aub:'IRON WORLD · 0.39 AU',
  r:.72, dist:14, T:88, incl:.12, tilt:.01, spin:TAU/60,
  tex:{ base:'#97939b', craters:{n:110,r0:1,r1:5},
        specks:{n:160,r0:.5,r1:2,cols:[['#6f6b72',.25],['#c9c5cd',.2]]} },
  data:[['DIAMETER','4,879 KM'],['DAY','58.6 D'],['YEAR','88 D'],['MOONS','0']],
  fact:'Its sun-rise to sun-rise takes 176 Earth days — two full Mercurian years.' },
{ id:'venus', name:'VENUS', color:'#e6c88a', au:'0.72', aub:'GREENHOUSE WORLD · 0.72 AU',
  r:1.15, dist:20, T:224.7, incl:.06, tilt:-.06, spin:-TAU/380,
  tex:{ base:'#d7b076', bands:[{f:3,a:.4,c:'#e9d3a4',p:1},{f:7,a:.3,c:'#c0905a'},{f:12,a:.18,c:'#f2e2ba'}],
        specks:{n:60,r0:2,r1:8,cols:[['#e6c896',.18]]} },
  data:[['DIAMETER','12,104 KM'],['DAY','243 D ↺'],['YEAR','224.7 D'],['MOONS','0']],
  fact:'Spins backwards, so on Venus the Sun rises in the west and sets in the east.' },
{ id:'earth', name:'EARTH', color:'#62a8ff', au:'1.00', aub:'TERRAN WORLD · 1.00 AU',
  r:1.25, dist:27, T:365.25, incl:0, tilt:.41, spin:TAU*1.6, clouds:true,
  tex:{ base:'#1e4d94',
        blobs:[{c:'#3c7d49',n:22,r0:14,r1:34,a:.95},{c:'#6f7a45',n:12,r0:8,r1:16,a:.75},{c:'#8a7550',n:8,r0:6,r1:12,a:.5}],
        specks:{n:120,r0:.5,r1:1.6,cols:[['#2e6cb4',.25]]}, polar:{hF:.05,a:.92} },

function showCard(d, tracking){

  $('cFact').textContent=d.fact;

  card.classList.add('open');
}
function setListSel(id){
  document.querySelectorAll('#list button').forEach(b=>b.classList.toggle('sel', b.dataset.id===id));
}
function select(rec){
  if(!rec){ release(); return; }
  setListSel(rec.data.id);
  if(rec.data.id==='belt'){ selected=null; showCard(rec.data,false); return; }
  selected=rec;
  const p=worldPos(rec,tmpV).clone();
  cam.dir.copy(camera.position).sub(p);
  if(cam.dir.lengthSq()<1e-4) cam.dir.set(0,.5,1);
  cam.dir.normalize();
  cam.followR = rec.data.id==='sun' ? 30 : rec.radius*6 + 3.2;
  cam.goalP.copy(p).addScaledVector(cam.dir, cam.followR);
  cam.goalT.copy(p);
  cam.fromP.copy(camera.position); cam.fromT.copy(controls.target);
  cam.t=0; cam.dur=1.3; cam.mode='to'; cam.follow=rec;
  controls.enabled=false;
  showCard(rec.data,true);
}
function release(){
  selected=null; setListSel(null); showCard(null);
  cam.follow=null; cam.mode='free'; controls.enabled=true;
}
function goHome(){
  cam.fromP.copy(camera.position); cam.fromT.copy(controls.target);
  cam.goalP.copy(HOME); cam.goalT.set(0,0,0);
  cam.t=0; cam.dur=1.4; cam.mode='to'; cam.follow=null;
  controls.enabled=false;
}
function updateCamera(dt){
  if(cam.mode==='to'){
    cam.t=Math.min(1, cam.t+dt/cam.dur);
    const e=cam.t*cam.t*(3-2*cam.t);
    let gp=cam.goalP, gt=cam.goalT;
    if(cam.follow){
      worldPos(cam.follow, tmpV);
      cam.goalP.copy(tmpV).addScaledVector(cam.dir, cam.followR);
      gp=cam.goalP; gt=tmpV;
    }
    camera.position.lerpVectors(cam.fromP, gp, e);
    controls.target.lerpVectors(cam.fromT, gt, e);
    if(cam.t>=1){
      cam.mode = cam.follow ? 'track' : 'free';
      controls.enabled=true;
      if(cam.follow) worldPos(cam.follow, lastP);
    }
  } else if(cam.mode==='track' && cam.follow){
    worldPos(cam.follow, tmpV);
    d2.subVectors(tmpV, lastP);
    camera.position.add(d2);
    controls.target.copy(tmpV);
    lastP.copy(tmpV);
  }
  controls.update();
}

function updateComet(dDays){
  CC.E += (TAU/CC.T)*dDays / Math.pow(1-CC.e*Math.cos(CC.E),2);
  const r=CC.a*(1-CC.e*Math.cos(CC.E));
  cometGroup.position.set(CC.a*(Math.cos(CC.E)-CC.e), 0, CB*Math.sin(CC.E));
  const p=cometGroup.position;
  tDir.copy(p).normalize();
  xv.copy(camera.position).sub(p).normalize();
  zv.crossVectors(xv,tDir).normalize();
  m4.makeBasis(xv,tDir,zv);
  cometTail.quaternion.setFromRotationMatrix(m4);
  const len=THREE.MathUtils.clamp(1400/r, 7, 120);
  cometTail.scale.set(1.2+len*.05, len, 1);
  cometGlow.material.opacity=THREE.MathUtils.clamp(60/r, .15, .9);
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(), .05), t=clock.elapsedTime;
  const dps=paused?0:speedFromSlider()*dirn;
  const dDays=dps*dt; simDays+=dDays;

  for(const rec of recs){
    if(rec.fixed || rec.data.id==='comet' || rec.data.id==='belt') continue;
    if(rec.data.id==='moon'){ rec.pivot.rotation.y = TAU*simDays/27.3 + 2; continue; }
    const a=rec.a0 + TAU*simDays/rec.data.T;
    rec.holder.position.set(Math.cos(a)*rec.data.dist, 0, Math.sin(a)*rec.data.dist);
    rec.mesh.rotation.y += rec.data.spin*dDays;
    if(rec.cloud) rec.cloud.rotation.y += rec.data.spin*1.35*dDays;
  }
  updateComet(dDays);
  sunRec.mesh.rotation.y += TAU/25*dDays;
  if(showBelt) beltPts.rotation.y += TAU/1500*dDays;
  starA.rotation.y += dt*.004; starB.rotation.y -= dt*.006;
  starB.material.opacity=.75+.25*Math.sin(t*1.9);
  cor1.scale.setScalar(22*(1+.035*Math.sin(t*1.3)));
  cor2.scale.setScalar(46*(1+.02*Math.sin(t*.9+2)));
  cor1.material.rotation += dt*.12; cor2.material.rotation -= dt*.05;

  if(mouseMoved){ doHover(); mouseMoved=false; }
  updateCamera(dt);
  if(showLabels) updateLabels();
  renderer.render(scene, camera);

  hudTimer+=dt;
  if(hudTimer>.12){ hudTimer=0; updateHud(); }
  if(!booted){ booted=true;
    setTimeout(()=>{ $('boot').classList.add('done');
      setTimeout(()=>$('boot').remove(), 800); }, 400); }
}
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
updateHud();
animate();
</script>
